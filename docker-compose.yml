services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: music-pipeline-api
    restart: unless-stopped
    environment:
      - DENO_INSTALL=/opt/deno
      - PATH=/opt/deno/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./cookies.txt:/app/cookies.txt
      - ./config.yaml:/app/config.yaml
      - deno_cache:/opt/deno
    ports:
      - "0.0.0.0:81:81"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:81/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: music-pipeline-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:82:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  deno_cache:
