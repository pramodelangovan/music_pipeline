# Music Pipeline Configuration

paths:
  cookies: "cookies.txt"              # relative to project root
  output_base: "/media/disks/nas/music"
  logs: "logs"
  deno: "/home/pramod/.deno/bin"

yt_dlp:
  audio_format: "mp3"
  audio_quality: 0
  retries: 5
  sleep_interval: 3
  max_sleep_interval: 8
  remote_components: "ejs:github"

delays:
  between_albums: 40        # seconds between album downloads
  between_singles: 10       # seconds between single downloads
  between_artists: 60       # seconds between artists

error_handling:
  skip_unavailable: true    # skip 404/private/terminated videos
  max_errors_per_artist: 10 # stop artist if too many errors
  retry_on_bot_detection: true
  retry_delay: 300          # seconds to wait if bot-detected (5 min)
  fail_on_cookie_error: true  # stop everything if cookies expired

notifications:
  log_level: "INFO"         # DEBUG, INFO, WARNING, ERROR
  save_error_report: true   # save errors to logs/errors_{timestamp}.json
  show_tui: true            # show rich TUI progress

playlist:
  output_base: "/media/disks/nas/music/Playlists"
  max_bitrate: 0            # 0 = best available MP3 quality

queue_download:
  gap_seconds: 12           # seconds between each queued download
  output_base: "downloads" # base folder for queued audio/video output

cleanup:
  delete_empty_folders: true
  fix_filenames: true
  fix_metadata: true
  delete_jukebox_if_split: true
  min_split_tracks: 3       # min tracks in tracks/ to consider jukebox redundant
